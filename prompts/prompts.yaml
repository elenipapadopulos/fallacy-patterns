zero-shot:
  system_prompt:
  - "You are a logical reasoning expert. Your task is to carefully examine the given argument and classify it into one of the following classes: {fallacies}."
  user_prompt: "Given an argument, classify the fallacy it contains using one of the following labels: {fallacies}.
  Respond only with the name of the fallacy, with no additional text.\n
  Argument: {text}\n 
  Fallacy:"

