multistep:
  system_prompt:
  - "You are a logical reasoning expert. Your task is to carefully examine the given argument and classify it into one of the following classes: {fallacies}."
  user_prompt: "Given an argument, your task is to process it in three steps:
Step 1 (Form Extraction): 
When given a sentence, extract its underlying syntactic logical form.
Use abstract placeholders like A, B, C to replace specific nouns or phrases, but ensure the pattern closely mirrors the logical structure and progression of the original sentence.
Preserve logical connectors and adverbs such as ‘therefore’, ‘because’, ‘if’, ‘then’, etc.
The goal is to abstract away from surface wording while preserving the sentence’s original reasoning form. n

Step 2 (Pattern Matching):
From the list of known fallacy patterns provided below, return the one that most closely matches the pattern you extracted in Step 1. \n

Step 3 (Fallacy Classification):
Based on the extracted and matched pattern, classify the argument into one of the logical fallacy types from the list: {fallacies}\n
Choose the most appropriate category based on the structure of the reasoning.\n

Use the following reasoning patterns as reference for Step 2:
{attr}\n

Analyze the following argument: {text}
Step 1 (Form Extraction):\n
Step 2 (Matching Pattern):\n
Step 3 (Fallacy):"

guidelines:
  system_prompt:
  - "You are a logical reasoning expert. Your task is to carefully examine the given argument and classify it into one of the following classes: {fallacies}."
  user_prompt: "Given an argument, your task is to classify the type of logical fallacy. Choose one of the following: {fallacies}.
    To assist you in this task, you are provided with useful guidelines. These include typical reasoning patterns for each fallacy, common mistakes that often lead to misclassification and a quick practical checklist for classification: {attr}.
    Return only the name of the fallacy. \n
    Argument: {text} \n
    Fallacy:"
